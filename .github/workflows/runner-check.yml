# Test pipeline for the self-hosted runner on the build Mac (label "hammer").
#
# Prints a greeting, then reports whether this run would qualify for a release: started by a tag whose
# commit is on main. Only reports; it always finishes successfully.
#
#   Release case:  git tag test-1 && git push origin test-1   (on a commit that is on main)
#   Other cases:   Actions tab → "Runner check" → Run workflow, on any branch

name: Runner check

on:
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  check:
    runs-on: [self-hosted, hammer]
    steps:
      - name: Say hello
        run: echo "Hello, it works"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag and branch
        run: |
          echo "runner:  $RUNNER_NAME ($(whoami)@$(hostname -s))"
          echo "trigger: $GITHUB_EVENT_NAME, $GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
          echo "commit:  $GITHUB_SHA"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              tagged="yes"
          else
              tagged="no"
          fi

          git fetch --quiet origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              on_main="yes"
          else
              on_main="no"
          fi

          echo "tagged:  $tagged"
          echo "on main: $on_main"
          if [[ "$tagged" == "yes" && "$on_main" == "yes" ]]; then
              echo "STATUS:  release conditions met. A release build would run."
          else
              echo "STATUS:  release conditions not met. A release build would be skipped."
          fi
