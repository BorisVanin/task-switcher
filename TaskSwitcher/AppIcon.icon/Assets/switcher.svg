<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Foreground of Artifacts/icons/option-a-blue-accent.svg. The blue gradient background, the icon
       shape and its shadow come from icon.json / the system, so this layer holds only the switcher.
       The original was drawn on an 824 pt body at (100, 100); the transform maps it onto the full canvas. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFB627"/>
    </linearGradient>
  </defs>

  <g transform="scale(1.242718) translate(-100 -100)">
    <rect x="172" y="392" width="680" height="240" rx="70" fill="url(#panel)" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>
    <rect x="407" y="407" width="210" height="210" rx="52" fill="#fff" fill-opacity="0.24" stroke="#fff" stroke-opacity="0.2" stroke-width="2"/>

    <rect x="227" y="427" width="170" height="170" rx="40" fill="#fff" fill-opacity="0.5"/>
    <rect x="427" y="427" width="170" height="170" rx="40" fill="url(#gold)"/>
    <rect x="627" y="427" width="170" height="170" rx="40" fill="#fff" fill-opacity="0.5"/>
  </g>
</svg>
